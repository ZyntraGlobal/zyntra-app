name: Notificação diária de compras e pendências

on:
  schedule:
    # Roda a cada 15 min o dia inteiro — os próprios scripts decidem se é hora de
    # notificar (8h BRT) e evitam duplicar. Isso protege contra o GitHub
    # Actions atrasar/pular um horário de cron exato ocasionalmente.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}    # permite disparar manualmente pra testar

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install web-push --no-save
      - name: Verificar e notificar — Compras
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
        run: node scripts/notif-diaria.js
      - name: Verificar e notificar — Pendências
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
        run: node scripts/notif-pendencias.js
